root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
cmd = "go build -o ./tmp/main.exe ."
pre_cmd = ["templ generate"]
# delay = 100
env = [
  "DEV=true",
]
exclude_dir = ["assets", "tmp", "vendor", "dist"]
exclude_regex = ["_templ\\.go", "_test\\.go"]
include_ext = ["go", "tpl", "tmpl", "templ", "html"]

[screen]
clear_on_rebuild = true
keep_scroll = true

[misc]
# Delete tmp directory on exit
clean_on_exit = true
